name: Build portable Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build portable EXE
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Validate source files
        run: python -m py_compile app.py converter.py theme.py

      - name: Build single-file portable EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name OrechMenachem
          --collect-all PyQt5
          --collect-all lxml
          app.py

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\OrechMenachem.exe")) {
            throw "The EXE was not created."
          }
          Get-Item "dist\OrechMenachem.exe" | Format-List Name, Length

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: OrechMenachem-Windows-portable
          path: dist/OrechMenachem.exe
          if-no-files-found: error
          retention-days: 30
